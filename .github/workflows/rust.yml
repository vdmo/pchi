name: Rust

# Until now this repo had zero CI: the 25 tests covering the Only-Lang
# parser, the signed governance chain, and the conductor's UDP-to-rule-
# engine wiring only ran when someone remembered to run them locally. This
# is what actually protects that work going forward.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (workspace)
        run: cargo build --workspace --verbose

      - name: Test (workspace)
        run: cargo test --workspace --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true # cargo fmt has never been run on this codebase (116 pre-existing
        # diff hunks, all whitespace); fixing that is a separate, dedicated change, not something
        # to smuggle into a CI PR. Report, don't block, until that happens.

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        # No continue-on-error: the 6 pre-existing warnings this would have caught (unused
        # imports, a manual range-contains, a redundant single-component import) are fixed in
        # this same PR, so this is a real gate, not a report-only check from day one.
