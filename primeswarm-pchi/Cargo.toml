[package]
name = "primeswarm-pchi"
version = "0.1.0"
edition = "2021"
description = "PCHI Conductor - Central state management with PIR mathematical governance"

[dependencies]
pchi-schema = { path = "../../prime-market/pchi-schema" }
tokio = { version = "1.34", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
tokio-tungstenite = "0.24"
futures-util = "0.3"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "cors"] }

[dev-dependencies]
tokio-test = "0.4"
